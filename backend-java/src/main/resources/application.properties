# Variables de entorno (todas opcionales). Ver README.
server.port=${PORT:7070}

# --- Cola web (Tomcat) ---
# Techo de peticiones atendidas a la vez: con más usuarios de JMeter, esperan en cola
server.tomcat.threads.max=${MAX_THREADS:200}
# Conexiones que esperan en cola cuando todos los hilos están ocupados
server.tomcat.accept-count=${ACCEPT_COUNT:100}
# Al recibir SIGTERM, termina las peticiones en curso antes de vaciar el log
server.shutdown=graceful

# --- Base de datos (PostgreSQL) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/banco}
spring.datasource.username=${DB_USER:banco}
spring.datasource.password=${DB_PASSWORD:banco}
# Cola del DataSource (HikariCP): conexiones del pool y cuánto espera una petición a
# que quede una libre antes de fallar con 503. Réplicas x pool < max_connections.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=${DB_TIMEOUT_MS:5000}
# schema.sql y data.sql al arrancar. Se pueden ejecutar varias veces y con varias
# réplicas a la vez; no borran datos (el reset es db/reset.sql, a mano).
spring.sql.init.mode=${DB_INIT:always}
# Cada script se ejecuta entero como una sola sentencia: así el bloque DO de
# schema.sql, que lleva ';' dentro, no se parte. Es el valor especial de Spring
# para eso; con cualquier otro separador que no aparezca, Spring parte por líneas.
spring.sql.init.separator=^^^ END OF SCRIPT ^^^

trafico.log.path=${TRAFFIC_LOG:trafico.json}
# Minutos de inactividad tras los que la cookie de sesión caduca
trafico.sesion.inactividad-min=${SESSION_TIMEOUT_MIN:30}

spring.main.banner-mode=off
spring.application.name=bank-api-stress

# --- Actuator ---
# /actuator/health (con la BD), /actuator/health/liveness y /readiness, y /actuator/metrics
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.probes.enabled=true
# Liveness sin la BD: si cae la BD no hay que reiniciar los pods, no lo arreglaría.
management.endpoint.health.group.liveness.include=livenessState
# Readiness con la BD: sin ella, el pod deja de recibir tráfico del Service.
management.endpoint.health.group.readiness.include=readinessState,db
# Métricas de Tomcat (tomcat.threads.busy, tomcat.threads.current...)
server.tomcat.mbeanregistry.enabled=true
